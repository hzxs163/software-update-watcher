name: check-updates

on:
  schedule:
    # 每 6 小时运行一次（UTC 时间，对应北京时间 2/8/14/20 点）
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发 / 配置台「立即触发检查」按钮触发
    inputs:
      full_index:
        description: '全量重建索引（抓取全站所有分页，耗时较长）'
        required: false
        default: 'false'
        type: boolean
      pages:
        description: '索引本轮最多抓取页数（留空=按源配置的全量；填 60/120 可分批跑完，避免撞超时）'
        required: false
        default: ''
        type: string

# 时间换算在 main.py 内用 zoneinfo 完成，不依赖 runner 的 TZ
env:
  TZ: Asia/Shanghai

permissions:
  contents: write # 允许提交更新后的 state.json / last_check.json / index

concurrency:
  group: check-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # 防止抓取卡死把 6 小时额度耗光（历史上一轮常规检查约 1.5-8 分钟）
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update check
        # workflow inputs 不直接插进 shell（避免命令注入）：改走 env，并校验 --pages 只能是数字
        env:
          FULL_INDEX: ${{ github.event.inputs.full_index }}
          PAGES: ${{ github.event.inputs.pages }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          ARGS=""
          if [ "$FULL_INDEX" = "true" ]; then
            ARGS="$ARGS --full-index"
          fi
          case "$PAGES" in
            ''|*[!0-9]*) : ;;
            *) ARGS="$ARGS --pages $PAGES" ;;
          esac
          echo "附加参数: ${ARGS:-（无）}"
          python src/main.py $ARGS

      # 即使 main.py 因「所有源全失败」返回非 0，也要把 state/last_check 提交回去，
      # 否则下一轮会拿不到本轮的失败计数，告警与基线保护都会失效。
      - name: Commit state changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/state.json src/last_check.json src/index/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: update check state & last result [skip ci]"
            git push
          fi

      # 把检查结论提成 job 摘要，Actions 页面一眼看到哪个源挂了
      - name: Summarize
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("src/last_check.json")
          if not p.exists():
              print("无 last_check.json（脚本可能提前崩溃）")
          else:
              d = json.loads(p.read_text(encoding="utf-8"))
              print(f"### {d.get('checked_at')} （北京时间）")
              print(f"- 结论：**{d.get('message')}**")
              for sid, s in (d.get("sources") or {}).items():
                  if s.get("error"):
                      print(f"- ❌ {s.get('name')}: 连续 {s.get('fail_streak')} 轮失败，"
                            f"保留旧基线 {s.get('kept_seen')} 条")
                  else:
                      print(f"- ✅ {s.get('name')}: 抓到 {s.get('fetched')} 条 / "
                            f"命中 {s.get('matched')} 条 / 新增 {s.get('new')} 条")
          PY
